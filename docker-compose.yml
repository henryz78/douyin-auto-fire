services:
  douyin-auto-fire:
    image: ghcr.io/unmev/douyin-auto-fire:latest
    container_name: douyin-auto-fire
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      CRON_SCHEDULE: ${CRON_SCHEDULE:-30 0 * * *}
      RUN_ON_START: ${RUN_ON_START:-false}
      HEADLESS: ${HEADLESS:-true}
      DOUYIN_COOKIE: ${DOUYIN_COOKIE:-/data/cookie.json}
      DOUYIN_STORAGE_STATE: ${DOUYIN_STORAGE_STATE:-}
      DOUYIN_PROXY_SERVER: ${DOUYIN_PROXY_SERVER:-}
      DOUYIN_PROXY_USERNAME: ${DOUYIN_PROXY_USERNAME:-}
      DOUYIN_PROXY_PASSWORD: ${DOUYIN_PROXY_PASSWORD:-}
      TASK_CONFIG: ${TASK_CONFIG:-/app/config.json}
      ARTIFACTS_DIR: ${ARTIFACTS_DIR:-/app/artifacts}
      DINGTALK_WEBHOOK: ${DINGTALK_WEBHOOK:-}
      DINGTALK_SECRET: ${DINGTALK_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - ./config.json:/app/config.json:ro
      - ./cookie.json:/data/cookie.json:ro
      - ./storage_state:/data/storage_state:ro
      - ./config:/app/config:ro
      - ./artifacts:/app/artifacts
