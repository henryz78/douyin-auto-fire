name: Send Douyin Messages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only verify login and friends without sending
        type: boolean
        default: false
      bootstrap_state:
        description: Initialize persistent state when no archive exists (explicit one-time use)
        type: boolean
        default: false
  #使用github actions的日程 可以把下面的这三行代码注释删掉  用外部的不用管 
  # schedule:
  #   - cron: "0 0 * * *"
  #     timezone: "Asia/Shanghai"

concurrency:
  group: douyin-daily-sender
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
      DOUYIN_CONFIG: ${{ secrets.DOUYIN_CONFIG }}
      DOUYIN_PROXY_SERVER: ${{ secrets.DOUYIN_PROXY_SERVER }}
      DOUYIN_PROXY_USERNAME: ${{ secrets.DOUYIN_PROXY_USERNAME }}
      DOUYIN_PROXY_PASSWORD: ${{ secrets.DOUYIN_PROXY_PASSWORD }}
      DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
      DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      HEADLESS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compute state artifact key
        id: state_key
        shell: bash
        run: |
          set -euo pipefail
          key="$(python -c 'import hashlib, os; print(hashlib.sha256(os.environ["GITHUB_REF_NAME"].encode("utf-8")).hexdigest())')"
          echo "branch_key=$key" >> "$GITHUB_OUTPUT"
      - name: Restore persistent send state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          BOOTSTRAP_STATE: ${{ inputs.bootstrap_state }}
          STATE_BRANCH_KEY: ${{ steps.state_key.outputs.branch_key }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if [[ "$DRY_RUN" == "true" ]]; then
            if [[ "$BOOTSTRAP_STATE" == "true" ]]; then
              echo "bootstrap_state 不能与 Dry Run 同时使用" >&2
              exit 1
            fi
            echo "Dry Run：不恢复或写入跨运行状态"
            exit 0
          fi

          metadata="$RUNNER_TEMP/douyin-state-artifacts.json"
          printf '{"artifacts":[]}' > "$metadata"
          page=1
          while true; do
            response="$RUNNER_TEMP/douyin-state-artifacts-${page}.json"
            api_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100&page=${page}"
            if ! curl --fail --silent --show-error --location \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api_url" > "$response"; then
              echo "无法读取 GitHub Actions 状态归档列表，已安全停止任务" >&2
              exit 1
            fi
            if ! jq -e '(.artifacts? | type) == "array"' "$response" > /dev/null; then
              echo "GitHub Actions 状态归档列表格式无效，已安全停止任务" >&2
              exit 1
            fi
            jq -s '{artifacts: (.[0].artifacts + .[1].artifacts)}' "$metadata" "$response" > "$metadata.tmp"
            mv "$metadata.tmp" "$metadata"
            count="$(jq -r '.artifacts | length' "$response")"
            if [[ "$count" -lt 100 ]]; then
              break
            fi
            page=$((page + 1))
          done

          prefix="douyin-state-${STATE_BRANCH_KEY}-"
          pending_prefix="douyin-state-pending-${STATE_BRANCH_KEY}-"
          pending_names="$(jq -r --arg prefix "$pending_prefix" '
            .artifacts[]?
            | select((.expired == false) and (((.name // "") | startswith($prefix))))
            | .name
          ' "$metadata")"
          while IFS= read -r pending; do
            [[ -z "$pending" ]] && continue
            suffix="${pending#"$pending_prefix"}"
            expected="${prefix}${suffix}"
            if ! jq -e --arg expected "$expected" '
              .artifacts[]?
              | select((.expired == false) and .name == $expected)
            ' "$metadata" > /dev/null; then
              echo "发现未完成的发送状态 marker（${pending}），为避免回退到旧 history，已安全停止任务" >&2
              exit 1
            fi
          done <<< "$pending_names"

          artifact_json="$(jq -c --arg prefix "$prefix" '
            [ .artifacts[]?
              | select(.expired == false)
              | select((.name // "") | startswith($prefix))
            ]
            | sort_by(.created_at)
            | last // empty
          ' "$metadata")"
          if [[ -z "$artifact_json" || "$artifact_json" == "null" ]]; then
            if [[ "$BOOTSTRAP_STATE" == "true" ]]; then
              echo "未找到状态归档；已明确启用一次性 bootstrap，当前任务将建立首个状态归档" >&2
              echo "请确认此前没有在今天向这些好友发送过消息，避免初始化空 history 后产生重复发送" >&2
              exit 0
            fi
            echo "未找到当前分支的持久化状态归档；为避免重复发送，正式任务已安全停止" >&2
            echo "如需建立首个归档，必须显式启用 bootstrap_state；不要反复点击正式运行" >&2
            exit 1
          fi
          if [[ "$BOOTSTRAP_STATE" == "true" ]]; then
            echo "已存在状态归档，拒绝绕过恢复步骤使用 bootstrap_state" >&2
            exit 1
          fi

          download_url="$(jq -r '.archive_download_url // empty' <<<"$artifact_json")"
          if [[ -z "$download_url" ]]; then
            echo "状态归档元数据缺少下载地址，已安全停止任务" >&2
            exit 1
          fi
          zip_path="$RUNNER_TEMP/douyin-state-download.zip"
          if ! curl --fail --silent --show-error --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "$download_url" -o "$zip_path"; then
            echo "无法下载 GitHub Actions 状态归档，已安全停止任务" >&2
            exit 1
          fi
          python -m app.actions_state extract-zip \
            --zip "$zip_path" \
            --output "$RUNNER_TEMP/state.tar.gz"
          python -m app.actions_state restore \
            --archive "$RUNNER_TEMP/state.tar.gz" \
            --artifacts-dir artifacts \
            --branch "$GITHUB_REF_NAME"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Write protected configuration
        shell: bash
        run: printf '%s' "$DOUYIN_CONFIG" > config.json
      - name: Write multi-account configuration
        shell: bash
        env:
          COOKIE_1: ${{ secrets.DOUYIN_COOKIE_ACCOUNT1 }}
          CONFIG_1: ${{ secrets.DOUYIN_CONFIG_ACCOUNT1 }}
          COOKIE_2: ${{ secrets.DOUYIN_COOKIE_ACCOUNT2 }}
          CONFIG_2: ${{ secrets.DOUYIN_CONFIG_ACCOUNT2 }}
          COOKIE_3: ${{ secrets.DOUYIN_COOKIE_ACCOUNT3 }}
          CONFIG_3: ${{ secrets.DOUYIN_CONFIG_ACCOUNT3 }}
          COOKIE_4: ${{ secrets.DOUYIN_COOKIE_ACCOUNT4 }}
          CONFIG_4: ${{ secrets.DOUYIN_CONFIG_ACCOUNT4 }}
          COOKIE_5: ${{ secrets.DOUYIN_COOKIE_ACCOUNT5 }}
          CONFIG_5: ${{ secrets.DOUYIN_CONFIG_ACCOUNT5 }}
          LEGACY_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
          LEGACY_CONFIG: ${{ secrets.DOUYIN_CONFIG }}
        run: |
          mkdir -p config/tasks
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          if not any(os.environ.get(f"COOKIE_{i}") for i in range(1, 6)):
              # 没有配置任何多账号 Secret（DOUYIN_COOKIE_ACCOUNTn）：
              # 保持旧单账号模式，不生成 accounts.json。
              print("未配置多账号 Secret，继续使用旧单账号模式")
              raise SystemExit(0)

          accounts = []
          for index in range(1, 6):
              if index == 1 and not os.environ.get("COOKIE_1") and not os.environ.get("CONFIG_1"):
                  # 没有配置 DOUYIN_COOKIE_ACCOUNT1 时，旧版 DOUYIN_COOKIE /
                  # DOUYIN_CONFIG 自动作为账号1，方便老用户直接追加新账号。
                  cookie = os.environ.get("LEGACY_COOKIE")
                  config = os.environ.get("LEGACY_CONFIG")
              else:
                  cookie = os.environ.get(f"COOKIE_{index}")
                  config = os.environ.get(f"CONFIG_{index}")
              if not cookie and not config:
                  continue
              if not cookie or not config:
                  raise SystemExit(
                      f"账号 account{index} 的 DOUYIN_COOKIE_ACCOUNT{index} 与 "
                      f"DOUYIN_CONFIG_ACCOUNT{index} 必须同时配置"
                  )
              # 提前校验，出错时直接指出是哪个 Secret，避免任务执行时才报错
              try:
                  json.loads(cookie)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"DOUYIN_COOKIE_ACCOUNT{index} 不是有效 JSON: {exc}") from exc
              try:
                  json.loads(config)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"DOUYIN_CONFIG_ACCOUNT{index} 不是有效 JSON: {exc}") from exc
              env_file = f".env.account{index}"
              # Cookie 用 JSON 字符串转义后写入，dotenv 可精确还原，
              # 兼容多行 Cookie JSON 与 # 等特殊字符
              Path(env_file).write_text(
                  f"DOUYIN_COOKIE={json.dumps(cookie)}\nTASK_CONFIG=config/tasks/account{index}.json\n",
                  encoding="utf-8",
              )
              Path(f"config/tasks/account{index}.json").write_text(config, encoding="utf-8")
              accounts.append({"id": f"account{index}", "enabled": True, "env_file": env_file})
          Path("config/accounts.json").write_text(
              json.dumps({"accounts": accounts}, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY
      - name: Validate restored state layout
        if: ${{ inputs.dry_run == false && inputs.bootstrap_state == false }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f config/accounts.json ]]; then
            python -m app.actions_state validate-layout \
              --artifacts-dir artifacts \
              --accounts-file config/accounts.json
          else
            python -m app.actions_state validate-layout \
              --artifacts-dir artifacts
          fi
      - name: Prepare send attempt marker
        if: ${{ inputs.dry_run == false }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_RUN_ID" > "$RUNNER_TEMP/douyin-state-pending"
      - name: Upload send attempt marker
        if: ${{ inputs.dry_run == false }}
        uses: actions/upload-artifact@v4
        with:
          name: douyin-state-pending-${{ steps.state_key.outputs.branch_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/douyin-state-pending
          if-no-files-found: error
          retention-days: 7
      - name: Run
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            python run.py --dry-run
          else
            python run.py
          fi
      - name: Prepare persistent send state
        id: persistent_state
        if: ${{ always() && inputs.dry_run == false }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/state.tar.gz"
          if python -m app.actions_state prepare \
            --artifacts-dir artifacts \
            --output "$archive" \
            --branch "$GITHUB_REF_NAME" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"; then
            echo "has_state=true" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [[ "$status" -eq 3 ]]; then
              echo "has_state=false" >> "$GITHUB_OUTPUT"
              echo "没有可持久化的状态文件，保留上一份归档"
              exit 0
            fi
            exit "$status"
          fi
      - name: Upload persistent send state
        if: ${{ always() && inputs.dry_run == false && steps.persistent_state.outputs.has_state == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: douyin-state-${{ steps.state_key.outputs.branch_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/state.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-failure-${{ github.run_id }}
          path: artifacts/
          retention-days: 3
