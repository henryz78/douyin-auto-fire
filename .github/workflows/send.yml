name: Send Douyin Messages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only verify login and friends without sending
        type: boolean
        default: false
      reset_storage_state:
        description: Ignore the previous saved login state and use the current Cookie once
        type: boolean
        default: false
  # 使用 GitHub Actions 的日程时把下面三行注释删掉；用外部 cron 不用管
  # schedule:
  #   - cron: "0 0 * * *"
  #     timezone: "Asia/Shanghai"

concurrency:
  group: douyin-daily-sender
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
      DOUYIN_CONFIG: ${{ secrets.DOUYIN_CONFIG }}
      DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
      DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      WEBHOOK_HEADERS: ${{ secrets.WEBHOOK_HEADERS }}
      WEBHOOK_TEMPLATE: ${{ secrets.WEBHOOK_TEMPLATE }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DOUYIN_PROXY_SERVER: ${{ secrets.DOUYIN_PROXY_SERVER }}
      DOUYIN_PROXY_USERNAME: ${{ secrets.DOUYIN_PROXY_USERNAME }}
      DOUYIN_PROXY_PASSWORD: ${{ secrets.DOUYIN_PROXY_PASSWORD }}
      DOUYIN_STORAGE_STATE_OUTPUT: storage-state.next.json
      HEADLESS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Write protected configuration
        shell: bash
        run: printf '%s' "$DOUYIN_CONFIG" > config.json
      - name: Write multi-account configuration
        shell: bash
        env:
          COOKIE_1: ${{ secrets.DOUYIN_COOKIE_ACCOUNT1 }}
          CONFIG_1: ${{ secrets.DOUYIN_CONFIG_ACCOUNT1 }}
          COOKIE_2: ${{ secrets.DOUYIN_COOKIE_ACCOUNT2 }}
          CONFIG_2: ${{ secrets.DOUYIN_CONFIG_ACCOUNT2 }}
          COOKIE_3: ${{ secrets.DOUYIN_COOKIE_ACCOUNT3 }}
          CONFIG_3: ${{ secrets.DOUYIN_CONFIG_ACCOUNT3 }}
          COOKIE_4: ${{ secrets.DOUYIN_COOKIE_ACCOUNT4 }}
          CONFIG_4: ${{ secrets.DOUYIN_CONFIG_ACCOUNT4 }}
          COOKIE_5: ${{ secrets.DOUYIN_COOKIE_ACCOUNT5 }}
          CONFIG_5: ${{ secrets.DOUYIN_CONFIG_ACCOUNT5 }}
          LEGACY_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
          LEGACY_CONFIG: ${{ secrets.DOUYIN_CONFIG }}
        run: |
          mkdir -p config/tasks
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          if not any(os.environ.get(f"COOKIE_{i}") for i in range(1, 6)):
              # 没有配置任何多账号 Secret（DOUYIN_COOKIE_ACCOUNTn）：
              # 保持旧单账号模式，不生成 accounts.json。
              print("未配置多账号 Secret，继续使用旧单账号模式")
              raise SystemExit(0)

          accounts = []
          for index in range(1, 6):
              if index == 1 and not os.environ.get("COOKIE_1") and not os.environ.get("CONFIG_1"):
                  # 没有配置 DOUYIN_COOKIE_ACCOUNT1 时，旧版 DOUYIN_COOKIE /
                  # DOUYIN_CONFIG 自动作为账号1，方便老用户直接追加新账号。
                  cookie = os.environ.get("LEGACY_COOKIE")
                  config = os.environ.get("LEGACY_CONFIG")
              else:
                  cookie = os.environ.get(f"COOKIE_{index}")
                  config = os.environ.get(f"CONFIG_{index}")
              if not cookie and not config:
                  continue
              if not cookie or not config:
                  raise SystemExit(
                      f"账号 account{index} 的 DOUYIN_COOKIE_ACCOUNT{index} 与 "
                      f"DOUYIN_CONFIG_ACCOUNT{index} 必须同时配置"
                  )
              # 提前校验，出错时直接指出是哪个 Secret，避免任务执行时才报错
              try:
                  json.loads(cookie)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"DOUYIN_COOKIE_ACCOUNT{index} 不是有效 JSON: {exc}") from exc
              try:
                  json.loads(config)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"DOUYIN_CONFIG_ACCOUNT{index} 不是有效 JSON: {exc}") from exc
              env_file = f".env.account{index}"
              # Cookie 用 JSON 字符串转义后写入，dotenv 可精确还原，
              # 兼容多行 Cookie JSON 与 # 等特殊字符
              Path(env_file).write_text(
                  f"DOUYIN_COOKIE={json.dumps(cookie)}\nTASK_CONFIG=config/tasks/account{index}.json\n",
                  encoding="utf-8",
              )
              Path(f"config/tasks/account{index}.json").write_text(config, encoding="utf-8")
              accounts.append({"id": f"account{index}", "enabled": True, "env_file": env_file})
          Path("config/accounts.json").write_text(
              json.dumps({"accounts": accounts}, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY
      - name: Restore encrypted storage state
        id: restore_storage_state
        if: ${{ inputs.dry_run != true }}
        uses: actions/cache/restore@v4
        with:
          path: storage-state.enc
          key: douyin-storage-state-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            douyin-storage-state-${{ github.ref_name }}-
      - name: Prepare storage state for this run
        if: ${{ inputs.dry_run != true }}
        shell: bash
        env:
          DOUYIN_STORAGE_STATE_KEY: ${{ secrets.DOUYIN_STORAGE_STATE_KEY }}
          RESET_STORAGE_STATE: ${{ inputs.reset_storage_state }}
        run: |
          set -euo pipefail
          if [[ -f config/accounts.json ]]; then
            echo "多账号模式暂不启用跨运行 Storage State，继续使用各账号 Cookie"
            echo "DOUYIN_STORAGE_STATE_OUTPUT=" >> "$GITHUB_ENV"
            exit 0
          fi
          if [[ "$RESET_STORAGE_STATE" == "true" ]]; then
            echo "已请求忽略上一份 Storage State，本次使用当前 Cookie"
            exit 0
          fi
          if [[ ! -s storage-state.enc ]]; then
            echo "没有找到历史 Storage State，本次使用当前 Cookie"
            exit 0
          fi
          if [[ -z "${DOUYIN_STORAGE_STATE_KEY:-}" ]]; then
            echo "发现历史 Storage State，但未配置 DOUYIN_STORAGE_STATE_KEY；为避免回退到可能重复发送的 Cookie，任务停止" >&2
            exit 1
          fi
          key_file="$RUNNER_TEMP/douyin-storage-state-key"
          umask 077
          printf '%s' "$DOUYIN_STORAGE_STATE_KEY" > "$key_file"
          if ! gpg --batch --quiet --yes --pinentry-mode loopback \
            --passphrase-file "$key_file" --decrypt storage-state.enc > storage-state.json.tmp; then
            echo "Storage State 解密失败，任务停止" >&2
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("storage-state.json.tmp")
          try:
              value = json.loads(path.read_text(encoding="utf-8"))
          except (OSError, UnicodeDecodeError, json.JSONDecodeError) as exc:
              raise SystemExit(f"Storage State 不是有效 JSON: {exc}") from exc
          if not isinstance(value, dict) or not isinstance(value.get("cookies"), list):
              raise SystemExit("Storage State 格式无效")
          PY
          mv storage-state.json.tmp storage-state.json
          echo "DOUYIN_STORAGE_STATE=storage-state.json" >> "$GITHUB_ENV"
          echo "已恢复上一轮登录状态"
      - name: Run
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            python run.py --dry-run
          else
            python run.py
          fi
      - name: Encrypt storage state
        id: encrypt_storage_state
        if: ${{ always() && inputs.dry_run != true }}
        shell: bash
        env:
          DOUYIN_STORAGE_STATE_KEY: ${{ secrets.DOUYIN_STORAGE_STATE_KEY }}
        run: |
          set -euo pipefail
          echo "has_state=false" >> "$GITHUB_OUTPUT"
          if [[ ! -s storage-state.next.json ]]; then
            echo "本次没有生成新的 Storage State，保留上一份状态"
            exit 0
          fi
          if [[ -z "${DOUYIN_STORAGE_STATE_KEY:-}" ]]; then
            echo "未配置 DOUYIN_STORAGE_STATE_KEY，跳过跨运行状态保存；本次任务结果不受影响" >&2
            exit 0
          fi
          key_file="$RUNNER_TEMP/douyin-storage-state-key"
          umask 077
          printf '%s' "$DOUYIN_STORAGE_STATE_KEY" > "$key_file"
          if ! gpg --batch --quiet --yes --pinentry-mode loopback \
            --passphrase-file "$key_file" --symmetric --cipher-algo AES256 \
            --output storage-state.enc storage-state.next.json; then
            echo "Storage State 加密失败，跳过保存；本次任务结果不受影响" >&2
            exit 0
          fi
          echo "has_state=true" >> "$GITHUB_OUTPUT"
      - name: Save encrypted storage state
        if: ${{ always() && inputs.dry_run != true && steps.encrypt_storage_state.outputs.has_state == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: storage-state.enc
          key: douyin-storage-state-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-failure-${{ github.run_id }}
          path: artifacts/
          retention-days: 3
